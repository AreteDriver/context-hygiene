name: FT-CH-002 pinned field validation

on:
  pull_request:
    paths:
      - "scripts/validate_ft_ch_002.py"
      - ".github/workflows/ft-ch-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.12"
      - name: Install current source
        run: python -m pip install -e .
      - name: Validate pinned Browser Use AGENTS.md
        env:
          FT_CH_002_OUTPUT: ft-ch-002-results.json
        run: python scripts/validate_ft_ch_002.py
      - name: Retain sanitized measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ft-ch-002-measurements
          path: ft-ch-002-results.json
          retention-days: 7
          if-no-files-found: ignore
