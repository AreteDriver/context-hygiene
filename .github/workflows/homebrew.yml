name: Update Homebrew Formula

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v6
        with:
          python-version: "3.12"

      - name: Install poet
        run: |
          pip install homebrew-pypi-poet

      - name: Generate formula
        run: |
          mkdir -p Formula
          poet context-hygiene > Formula/context-hygiene.rb
          sed -i 's|class ContextHygiene|class ContextHygiene < Formula\n  include Language::Python::Virtualenv|' Formula/context-hygiene.rb

      - name: Commit formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/context-hygiene.rb
          git diff --cached --quiet || git commit -m "chore: update Homebrew formula for ${{ github.ref_name }}"
          git push
